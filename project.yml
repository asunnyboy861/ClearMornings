name: ClearMornings
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  ClearMornings:
    type: application
    platform: iOS
    sources:
      - ClearMornings
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.ClearMornings
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clear Mornings
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Clear Mornings uses Face ID to keep your sobriety journey private."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a daily selfie to see your recovery in the Mirror (fully optional)."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose an existing photo for your daily Mirror check-in (fully optional)."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: ClearMornings/ClearMornings.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.clearmornings.app]
        com.apple.security.application-groups: [group.com.zzoutuo.ClearMornings]
  ClearMorningsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ClearMorningsWidgets
      - Shared
      - ClearMornings/Engines/Engines.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.ClearMornings.Widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ClearMorningsWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: ClearMorningsWidgets/ClearMorningsWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zzoutuo.ClearMornings]
